{% load static %}

<section class="hero" id="home">

    <!-- Animated Background Image -->

    <div class="hero-background">

        {% if hero.background_image %}

            <img src="{{ hero.background_image.url }}"
                 alt="London Tower Bridge"
                 class="hero-bg-image">

        {% else %}

            <img src="{% static 'images/tower-bridge.jpeg' %}"
                 alt="London Tower Bridge"
                 class="hero-bg-image">

        {% endif %}

    </div>

    <!-- Dark Overlay -->

    <div class="hero-overlay"></div>

    <!-- Hero Content -->

    <div class="hero-content">

        <div class="hero-badge">
            {{ hero.badge_text }}
        </div>

        <h1>
            {{ hero.title }}
            <span>{{ hero.highlighted_title }}</span>
        </h1>

        <p class="hero-description">
            {{ hero.description }}
        </p>

        <p class="hero-sub-description">
            {{ hero.sub_description }}
        </p>

        <div class="hero-buttons">

            <a href="{{ hero.primary_button_link }}"
               class="btn btn-primary">

                {{ hero.primary_button_text }}

                <i class="fa-solid fa-arrow-right"></i>

            </a>

            <a href="{{ hero.secondary_button_link }}"
               class="btn btn-secondary">

                <i class="fa-solid fa-ticket"></i>

                {{ hero.secondary_button_text }}

            </a>

        </div>

    </div>

</section>
