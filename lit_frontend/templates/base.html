{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>London Indian Tamils (LIT)</title>

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <!-- Section CSS -->

    <link rel="stylesheet"
          href="{% static 'css/events.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/festive.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/past_events.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/highlights.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/voices.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/join.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/social.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/contact.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/footer.css' %}">

    <!-- Fixed Navbar CSS - Load Last -->

    <link rel="stylesheet"
          href="{% static 'css/navbar.css' %}?v=2">

</head>

<body>

    {% block content %}
    {% endblock %}

    <!-- JavaScript -->

    <script src="{% static 'js/main.js' %}"></script>

    <script src="{% static 'js/festive.js' %}"></script>

</body>

</html>
